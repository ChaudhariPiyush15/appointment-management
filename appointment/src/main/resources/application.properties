# =========================================
# Application Name
# =========================================
spring.application.name=appointment-management-system

# =========================================
# MySQL Datasource Configuration
# NOTE: Replace YOUR_PASSWORD below with your actual MySQL root password
# =========================================
spring.datasource.url=jdbc:mysql://localhost:3306/appointment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# =========================================
# JPA / Hibernate Configuration
# ddl-auto=update -> automatically creates/updates tables based on entities
# =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================================
# Server Configuration
# =========================================
server.port=8080

# =========================================
# Jackson - format dates/times as plain ISO strings in JSON
# =========================================
spring.jackson.serialization.write-dates-as-timestamps=false
